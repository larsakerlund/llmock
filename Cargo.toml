[package]
name = "llmock"
version = "0.1.0"
edition = "2021"
description = "Fast, byte-faithful emulator of LLM provider HTTP APIs for testing apps without a real LLM."
license = "MIT"
repository = "https://github.com/larsakerlund/llmock"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
