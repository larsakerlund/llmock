[package]
name = "llmock"
version = "0.1.1"
edition = "2024"
description = "Fast emulator of LLM provider HTTP APIs for testing apps without a real LLM."
license = "MIT"
repository = "https://github.com/larsakerlund/llmock"
homepage = "https://github.com/larsakerlund/llmock"
readme = "README.md"
rust-version = "1.96"
keywords = ["llm", "mock", "testing", "emulator", "openai"]
categories = [
    "development-tools::testing",
    "web-programming::http-server",
    "emulators",
]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tiktoken-rs = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
regex = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Strict linting. `clippy::all` and `clippy::pedantic` are denied so style
# issues, bugs, and slop fail the build; a small allow-list silences lints that
# are noise rather than signal for this codebase. CI runs `cargo clippy
# --all-targets` and `cargo fmt --check`.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Long, sequential SSE serializers read better as one function than split up.
too_many_lines = "allow"
# Adapter types intentionally echo their module (e.g. responses::ResponsesRequest).
module_name_repetitions = "allow"
# Flags proper nouns (OpenAI, TTFT, SSE) in docs as needing backticks.
doc_markdown = "allow"
# We don't document every fallible/panicking fn's error/panic conditions.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Token counts and content-block indices are small and bounded.
cast_possible_truncation = "allow"
# Usage-style structs mirror the wire shape (input_tokens/output_tokens/…).
struct_field_names = "allow"
