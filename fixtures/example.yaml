# Example llmock fixture set.
# Rules are tried top to bottom; the first whose `match` holds wins.
# A rule with an empty `match` matches anything — keep it last as a fallback.

rules:
  - match:
      user_contains: "weather"
    respond:
      content: "It's sunny and 22°C with a light breeze."
      finish_reason: stop
      usage:
        prompt_tokens: 12
        completion_tokens: 9
      stream:
        ttft_ms: 50         # delay before the first token
        inter_token_ms: 10  # delay between tokens
        chunk_by: word      # word | char | <positive integer>

  - match:
      model: "gpt-4o-mini"
    respond:
      content: "Mock reply from the gpt-4o-mini fixture."

  # --- Error / failure injection (M3) ---

  - match:
      user_contains: "boom"            # force a rate-limit error
    error:
      status: 429
      type: rate_limit_error
      message: "Rate limit reached for gpt-4o in organization org-llmock."
      code: rate_limit_exceeded

  - match:
      user_contains: "unauthorized"    # force an auth error
    error:
      status: 401
      type: invalid_request_error
      message: "Incorrect API key provided."
      code: invalid_api_key

  - match:
      user_contains: "truncate"        # stream a few tokens then drop the connection
    respond:
      content: "This response will be cut off partway through the stream."
      fault:
        kind: truncate
        after_tokens: 4

  - match: {}
    respond:
      content: "This is a default mock response from llmock."
