version: 2

# Keep dependencies and pinned references current. Commit prefixes follow the
# project's Conventional Commit types where the ecosystem allows it.
#
# Every ecosystem carries a 7-day cooldown: a new release has to be public for
# a week before Dependabot proposes it, so a compromised package is caught by
# the ecosystem before it can land here. Cooldown applies only to version
# updates; Dependabot security updates ignore it, so CVE patches still flow
# immediately.
updates:
  # Rust crates. Cargo does not support a separate prefix for dev-dependencies
  # (prefix-development and the production/development dependency-type filters
  # are unsupported for cargo), so every crate bump lands as `deps`. The runtime
  # crates are the point of that changelog section; relabel an occasional
  # dev-dependency bump (tower, tempfile, ...) to `build` at merge if you want it
  # out of the changelog.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  # GitHub Actions pinned by SHA; Dependabot reads the version comment to bump
  # both the hash and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions-minor:
        update-types: ["minor", "patch"]

  # pre-commit hooks, tag-pinned in .pre-commit-config.yaml. Dependabot bumps
  # the rev of each remote hook repo; the local cargo hooks have no rev to track.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      pre-commit-minor:
        update-types: ["minor", "patch"]

  # Dockerfile base images pinned by digest.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  # e2e provider SDKs (Python), managed by uv. These are test tooling, not the
  # app's runtime, so every bump lands as build (hidden from the changelog).
  - package-ecosystem: uv
    directory: "/e2e/sdk_compat"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      uv-minor:
        update-types: ["minor", "patch"]
