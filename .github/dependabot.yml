version: 2

# Keep dependencies and pinned references current. Commit prefixes follow the
# project's Conventional Commit types where the ecosystem allows it.
updates:
  # Rust crates. Cargo does not support a separate prefix for dev-dependencies
  # (prefix-development and the production/development dependency-type filters
  # are unsupported for cargo), so every crate bump lands as `deps`. The runtime
  # crates are the point of that changelog section; relabel an occasional
  # dev-dependency bump (tower, tempfile, ...) to `build` at merge if you want it
  # out of the changelog.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  # GitHub Actions pinned by SHA; Dependabot reads the version comment to bump
  # both the hash and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor:
        update-types: ["minor", "patch"]

  # Dockerfile base images pinned by digest.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
