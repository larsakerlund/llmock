version: 2

# Keep dependencies and pinned references current. Commit prefixes follow the
# project's Conventional Commit types: deps for the app's runtime crates, build
# for dev-dependencies and the base images, ci for the workflow actions.
updates:
  # Rust crates. Dependabot splits runtime and dev dependencies, so they land
  # under the right changelog section (deps vs build).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: build
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  # GitHub Actions pinned by SHA; Dependabot reads the version comment to bump
  # both the hash and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor:
        update-types: ["minor", "patch"]

  # Dockerfile base images pinned by digest.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
