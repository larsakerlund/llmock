name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Read the channel from rust-toolchain.toml so the pinned version lives
      # in one place and CI clippy == local clippy.
      - id: tc
        name: read toolchain channel
        run: echo "channel=$(grep -oP 'channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets

  docs:
    name: doc (deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - id: tc
        name: read toolchain channel
        run: echo "channel=$(grep -oP 'channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps

  cargo-deny:
    name: supply-chain (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sdk-e2e:
    name: real-SDK e2e (OpenAI, Anthropic, Gemini)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: tc
        name: read toolchain channel
        run: echo "channel=$(grep -oP 'channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      # uv provisions Python and the SDKs from e2e/sdk_compat/uv.lock; cache is
      # keyed on that lockfile.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: e2e/sdk_compat/uv.lock
      - name: run SDK-compat suites
        run: ./e2e/sdk_compat/run.sh
