name: scorecard

# OpenSSF Scorecard: audit the repo's supply-chain posture (pinned actions,
# token permissions, branch protection, dangerous workflow patterns, ...) and
# publish the result so the README badge can read it and so findings land in the
# Security tab. Runs on push to main, weekly, and when branch protection changes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read workflow runs for the dangerous-workflow checks
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish the result to the OpenSSF API (drives the badge)
    steps:
      - name: check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: upload the sarif artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: upload to code scanning
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        with:
          sarif_file: results.sarif
