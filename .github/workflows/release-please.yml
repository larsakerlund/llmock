name: release-please

# Open and maintain a release PR that bumps Cargo.toml/Cargo.lock and writes
# CHANGELOG.md from the Conventional Commit history. Merging that PR tags the
# release and publishes the GitHub Release; the docker job below then builds and
# pushes the versioned image in the same run.
on:
  push:
    branches: [main]

# No blanket permissions; each job requests only what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # The default GITHUB_TOKEN is enough: the docker job runs as a
          # dependent job in this same run, so it does not depend on the release
          # event firing (a release created by GITHUB_TOKEN cannot trigger other
          # workflows). To also run CI on the release PR, mint a GitHub App token
          # (actions/create-github-app-token) and pass it here instead:
          #   token: ${{ steps.app-token.outputs.token }}
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the provenance attestation
      attestations: write # record the attestation on the repo
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # QEMU lets the amd64 runner build the arm64 image too; released images are
      # multi-arch. (CI builds a single-arch image without pushing; see ci.yml.)
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        env:
          # Write OCI annotations onto both the per-arch manifests and the
          # multi-arch image index (default is only the manifest).
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          # Moving tags for a release: exact version, major.minor, major, latest.
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            type=raw,value=${{ needs.release-please.outputs.major }}
            type=raw,value=latest
      # Gate the release on vulnerabilities BEFORE publishing. Build amd64 into
      # the local daemon and scan it; the multi-arch push below reuses these
      # warmed builder layers, so the scan adds no extra compile. OS packages and
      # the Rust binary are arch-neutral for CVE purposes, so amd64 is enough.
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: llmock:scan
      - name: scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llmock:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Embed an SBOM. Provenance is signed separately (attest step below), so
          # the unsigned BuildKit provenance is off to avoid two provenance docs.
          provenance: false
          sbom: true
          # No cache on release builds: a release is a trust anchor, so it builds
          # clean from source rather than risk pulling a poisoned layer from the
          # shared gha cache. (The within-job builder cache from the scan build is
          # this run's own clean state, so reusing it is safe.)
      - name: attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
