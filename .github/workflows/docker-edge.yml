name: docker-edge

# Publish a bleeding-edge image on every push to main, so users can track the
# latest commit without building from source. Tagged images come from the
# release-please workflow; this only moves :edge (and a short-sha tag). Built
# amd64-only on purpose, for fast per-commit feedback; release images are
# multi-arch (amd64 + arm64).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-edge
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
