name: codeql

# Static analysis (SAST) with CodeQL. Rust is analysed with build-mode: none, so
# no compile step is needed. Runs on push to main, pull requests, and weekly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions: {}

jobs:
  analyze:
    name: analyze rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the CodeQL results to code scanning
    steps:
      - name: check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: initialize codeql
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
      - name: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:rust"
